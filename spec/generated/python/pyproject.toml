[project]
name = "openaudit-spec"
version = "0.1.0"
description = "OpenAudit spec records as Pydantic models, generated from spec/schemas."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openaudit_spec"]
