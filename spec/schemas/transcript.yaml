$defs:
  ReasoningKind:
    description: >-
      `raw`: the model's own thinking (open models). `summary`: the provider's summary.
      `omitted`: the provider gave none. `redacted`: the provider hid it.
    type: string
    enum: [raw, summary, omitted, redacted]

  TextPart:
    type: object
    additionalProperties: false
    required: [type, text]
    properties:
      type:
        const: text
      text:
        type: string

  ReasoningPart:
    type: object
    additionalProperties: false
    required: [type, kind]
    properties:
      type:
        const: reasoning
      kind:
        $ref: '#/$defs/ReasoningKind'
      text:
        type: string
      signature:
        type: string
        description: The provider's opaque blob, kept so the transcript can continue there.

  OtherPart:
    description: A part we do not show yet (an image, audio); the original log keeps it.
    type: object
    additionalProperties: false
    required: [type, kind]
    properties:
      type:
        const: other
      kind:
        type: string
        minLength: 1

  ContentPart:
    oneOf:
      - $ref: '#/$defs/TextPart'
      - $ref: '#/$defs/ReasoningPart'
      - $ref: '#/$defs/OtherPart'

  ToolCall:
    type: object
    additionalProperties: false
    required: [id, function]
    properties:
      id:
        type: string
        minLength: 1
      function:
        type: string
        minLength: 1
      arguments:
        type: object

  Message:
    description: One chat message. A superset of Inspect's and OpenAI's shape.
    type: object
    additionalProperties: false
    required: [id, role, content]
    properties:
      id:
        type: string
        minLength: 1
        description: Stable, so notes and links survive import and export.
      role:
        type: string
        enum: [system, user, assistant, tool]
      content:
        type: array
        items:
          $ref: '#/$defs/ContentPart'
      toolCalls:
        type: array
        items:
          $ref: '#/$defs/ToolCall'
      toolCallId:
        type: string
        minLength: 1
        description: For a `tool` message, the call it answers.
      model:
        type: string
        minLength: 1
        description: For an `assistant` message, the model that wrote it.

  Participant:
    type: object
    additionalProperties: false
    required: [id, role]
    properties:
      id:
        type: string
        minLength: 1
      role:
        $ref: '#/$defs/ModelRole'
      modelId:
        $ref: '#/$defs/Id'
      name:
        type: string
        minLength: 1
        description: The model or person as the source names it.

  Thread:
    description: One participant's ordered view of the conversation.
    type: object
    additionalProperties: false
    required: [id, participant, messages]
    properties:
      id:
        type: string
        minLength: 1
      participant:
        type: string
        minLength: 1
        description: A `Participant.id`.
      messages:
        type: array
        items:
          $ref: '#/$defs/Message'

  Transcript:
    title: Transcript
    description: >-
      The messages of one attempt or chat. Scores stay on the attempt. `extensions` keeps source
      fields we do not map (`extensions.inspect`).
    type: object
    additionalProperties: false
    required: [id, participants, threads]
    properties:
      id:
        $ref: '#/$defs/Id'
      participants:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/Participant'
      threads:
        type: array
        minItems: 1
        items:
          $ref: '#/$defs/Thread'
      extensions:
        type: object
