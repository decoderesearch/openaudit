  - $ref: '#/$defs/OpenAuditSnippet'
  - $ref: '#/$defs/OrgIncident'
  - $ref: '#/$defs/OrgIncidentEvent'
  - $ref: '#/$defs/OrgDeparture'
  - $ref: '#/$defs/Commitment'
