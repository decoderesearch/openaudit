$defs:
  RunStatus:
    description: >-
      `requested`: a user asked for it; it waits for an admin to approve it. `queued`: waits for
      a runner. `running`: a runner has it. `importing`: the log is being saved. `succeeded`,
      `failed`, `cancelled`: done.
    type: string
    enum: [requested, queued, running, importing, succeeded, failed, cancelled]

  RunOrigin:
    description: >-
      `run`: our runner ran it. `import`: a log made elsewhere, imported. `rescore`: our runner
      scored the outputs of `sourceRunId` again, with other scoring models.
    type: string
    enum: [run, import, rescore]

  RouteKind:
    description: >-
      How the target model was served. `direct`: the lab's own API. `openrouter`, `bedrock`,
      `vertex`, `azure`: that router or cloud. `engine`: our interp-engine server.
    type: string
    enum: [direct, openrouter, bedrock, vertex, azure, engine]

  ServingRoute:
    description: How a run reached the model. Provenance and a filter; not a change to the model.
    type: object
    additionalProperties: false
    required: [kind, model]
    properties:
      kind:
        $ref: '#/$defs/RouteKind'
      model:
        type: string
        minLength: 1
        description: The model id on the route (`qwen/qwen3.6-27b`).
      providers:
        type: array
        items:
          type: string
          minLength: 1
        description: The providers the router may use, in order (OpenRouter `provider.order`).
      allowFallbacks:
        type: boolean
      fallbacks:
        type: array
        items:
          type: string
          minLength: 1
        description: >-
          For a slot: other models to try, in order, when this model fails a call or refuses it
          (an error, a content filter or an empty reply).
      quantization:
        type: string
        minLength: 1
        description: The weights' precision as the route states it (`bf16`, `fp8`, `unknown`).

  RunSettings:
    description: "What the runner was asked to do. Left out: the task's default."
    type: object
    additionalProperties: false
    properties:
      reasoning:
        type: string
        enum: [none, minimal, low, medium, high, xhigh, max, 'on']
        description: >-
          Thinking effort, in OpenRouter's words. `none`: no thinking. `on`: thinking at the
          model's default, for models with no effort levels.
      limit:
        type: integer
        minimum: 1
        description: Run only the first samples of the dataset.
      epochs:
        type: integer
        minimum: 1
      maxConnections:
        type: integer
        minimum: 1
        description: Parallel model calls in each shard.
      shardSize:
        type: integer
        minimum: 1
        description: Samples in each shard. Left out, the runner's default.
      capKey:
        type: string
        minLength: 1
        description: >-
          The `runner_cap` key for the run's shards, for one cap per model server. Left out: from
          the route.
      temperature:
        type: number
        minimum: 0
      maxTokens:
        type: integer
        minimum: 1
      taskArgs:
        type: object
        description: 'Arguments for the task (`{"target": "mc1"}`).'
      models:
        type: object
        propertyNames:
          pattern: '^[a-z][a-z0-9_]*$'
        additionalProperties:
          $ref: '#/$defs/ServingRoute'
        description: The model for each slot in the version's `runner.models`, by slot id.

  TokenUsage:
    type: object
    additionalProperties: false
    properties:
      input:
        type: integer
        minimum: 0
      output:
        type: integer
        minimum: 0
      reasoning:
        type: integer
        minimum: 0
        description: Part of `output`.
      cacheRead:
        type: integer
        minimum: 0
        description: Input tokens read from the provider's prompt cache. Part of `input`.
      cacheWrite:
        type: integer
        minimum: 0
        description: Input tokens written to the provider's prompt cache. Part of `input`.

  FileRef:
    description: A file in our private storage.
    type: object
    additionalProperties: false
    required: [key, bytes]
    properties:
      key:
        type: string
        minLength: 1
        description: The object key (`runs/<run id>/log.eval`).
      bytes:
        type: integer
        minimum: 0
      sha256:
        $ref: '#/$defs/Sha256'

  RunProvenance:
    description: Where and how the run happened.
    type: object
    additionalProperties: false
    properties:
      tool:
        type: string
        minLength: 1
        description: The program that ran the eval (`inspect_ai`).
      toolVersion:
        type: string
        minLength: 1
      packages:
        type: object
        additionalProperties:
          type: string
        description: 'Package versions, as the log states them (`{"inspect_evals": "0.22.0"}`).'
      task:
        type: string
        minLength: 1
        description: The task as the log names it (`inspect_evals/truthfulqa`).
      taskArgs:
        type: object
      logModel:
        type: string
        minLength: 1
        description: The model as the log names it (`openrouter/qwen/qwen3.6-27b`).
      servedBy:
        type: array
        items:
          type: string
          minLength: 1
        description: The providers that served the model calls, as the route reported them.
      host:
        type: string
        minLength: 1
        description: The machine the runner ran on.
      runnerVersion:
        type: string
        minLength: 1
      startedAt:
        $ref: '#/$defs/Timestamp'
      finishedAt:
        $ref: '#/$defs/Timestamp'
      tokens:
        $ref: '#/$defs/TokenUsage'
      costUsd:
        type: number
        minimum: 0
        description: What this run paid, when the routes say. A re-score pays only its judges.
      note:
        type: string
        minLength: 1
        description: >-
          What a reader must know about an imported run, from the log (`eval.metadata.note`).
          The run and attempt pages show it.
      byModel:
        type: object
        additionalProperties:
          $ref: '#/$defs/ModelUsage'
        description: Tokens and cost for each model, by the name in the log.
      byRole:
        type: object
        additionalProperties:
          $ref: '#/$defs/ModelUsage'
        description: >-
          Tokens and cost for each model role (`target`, `auditor`, `judge`, `judge_2`). A
          re-score has only its judges.
      erroredSamples:
        type: integer
        minimum: 0
        description: Samples with an error and no score. The results leave them out.
      fallbacks:
        type: array
        items:
          $ref: '#/$defs/FallbackUse'
        description: The calls that a slot's fallback models made in place of its model.
      blocks:
        type: array
        items:
          $ref: '#/$defs/ProviderBlock'
        description: >-
          Model calls that a provider refused for its policy, by provider. A run that failed or
          was cancelled because of a block also has them.

  ProviderBlock:
    description: >-
      Samples whose model calls a provider refused for its policy (not the model's own
      refusal). These samples have no score.
    type: object
    additionalProperties: false
    required: [provider, kind, samples]
    properties:
      provider:
        type: string
        minLength: 1
        description: The provider that refused (`Meta`, `OpenAI`), or `unknown`.
      kind:
        type: string
        enum: [account, content]
        description: >-
          `account`: the provider blocked our account, so it refuses all calls. `content`: it
          refused these prompts only.
      code:
        type: string
        minLength: 1
        description: The provider's error code (`user_blocked`, `data_inspection_failed`).
      message:
        type: string
        minLength: 1
      model:
        type: string
        minLength: 1
        description: The model of the refused calls, when the error names it.
      samples:
        type: integer
        minimum: 0
        description: The samples with this block. Zero when the run stopped before its samples.

  FallbackUse:
    type: object
    additionalProperties: false
    required: [slot, model, calls]
    properties:
      slot:
        type: string
        pattern: '^[a-z][a-z0-9_]*$'
      model:
        type: string
        minLength: 1
      calls:
        type: integer
        minimum: 1

  ModelUsage:
    type: object
    additionalProperties: false
    properties:
      tokens:
        $ref: '#/$defs/TokenUsage'
      costUsd:
        type: number
        minimum: 0
      costEstimated:
        type: boolean
        description: The route did not state the cost; `costUsd` is list price times tokens.
      servedBy:
        type: array
        items:
          type: string
          minLength: 1

  EvalRun:
    title: EvalRun
    description: >-
      One run of an eval version on one model, with its settings and provenance. `measured`
      results and attempts point to it.
    type: object
    additionalProperties: false
    required: [id, evalId, evalVersionId, modelId, origin, status, route, settings, visibility, createdAt]
    if:
      properties:
        origin:
          const: rescore
    then:
      properties:
        sourceRunId: true
      required: [sourceRunId]
    properties:
      id:
        $ref: '#/$defs/Id'
      evalId:
        $ref: '#/$defs/Id'
      evalVersionId:
        $ref: '#/$defs/Id'
      modelId:
        $ref: '#/$defs/Id'
      origin:
        $ref: '#/$defs/RunOrigin'
      sourceRunId:
        $ref: '#/$defs/Id'
        description: For a re-score, the run whose outputs it scores.
      status:
        $ref: '#/$defs/RunStatus'
      route:
        $ref: '#/$defs/ServingRoute'
      settings:
        $ref: '#/$defs/RunSettings'
      provenance:
        $ref: '#/$defs/RunProvenance'
      log:
        $ref: '#/$defs/FileRef'
        description: The original log (an Inspect `.eval`).
      sampleCount:
        type: integer
        minimum: 0
        description: The samples the run plans to do.
      attemptCount:
        type: integer
        minimum: 0
        description: The attempts done so far.
      error:
        type: string
        minLength: 1
      visibility:
        $ref: '#/$defs/Visibility'
      createdAt:
        $ref: '#/$defs/Timestamp'

  AttemptStatus:
    type: string
    enum: [success, error]

  AttemptScore:
    description: One scorer's grade of an attempt, as Inspect's `Score`.
    type: object
    additionalProperties: false
    required: [value]
    properties:
      value:
        description: A number, a letter (`C` correct, `I` incorrect), or a yes/no.
        oneOf:
          - type: number
          - type: string
          - type: boolean
      answer:
        type: string
        description: The answer the scorer read from the output.
      explanation:
        type: string

  Hazard:
    description: >-
      Who can read a reply that can give dangerous help. `gated`: anyone, but no public share
      (J-Lens). `restricted`: staff. `withheld`: nobody on the site. The prompt, target and scores
      stay open.
    type: string
    enum: [gated, restricted, withheld]

  EvalAttempt:
    title: EvalAttempt
    description: >-
      One sample in one epoch of a run: a short copy of the input and output for lists, the
      scores, and the full transcript in `body`.
    type: object
    additionalProperties: false
    required: [id, runId, ordinal, sampleId, epoch, status, scores]
    properties:
      id:
        $ref: '#/$defs/Id'
      runId:
        $ref: '#/$defs/Id'
      ordinal:
        type: integer
        minimum: 1
        description: The attempt's place in the log, from 1. URLs use it.
      sampleId:
        type: string
        minLength: 1
        description: The sample's id in the log.
      evalSampleId:
        $ref: '#/$defs/Id'
        description: The stored `EvalSample`, when we keep the samples.
      epoch:
        type: integer
        minimum: 1
      status:
        $ref: '#/$defs/AttemptStatus'
      passed:
        type: boolean
        description: The headline score is correct. Left out when the score is not pass or fail.
      input:
        type: string
        description: The first user message, shortened.
      target:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      choices:
        type: array
        items:
          type: string
      output:
        type: string
        description: The final answer, shortened.
      scores:
        type: object
        additionalProperties:
          $ref: '#/$defs/AttemptScore'
        description: By scorer name.
      metrics:
        type: array
        items:
          type: string
        description: >-
          The keys of the metrics over a part of the samples (a category or group) that count
          this attempt, such as `harm_score_copyright`.
      error:
        type: string
        minLength: 1
      notScored:
        type: string
        minLength: 1
        description: Why the attempt has no scores, from the sample's `notScored` metadata.
      tokens:
        $ref: '#/$defs/TokenUsage'
      seconds:
        type: number
        minimum: 0
      display:
        $ref: '#/$defs/DisplayRule'
        description: A subset rule that matched this sample. Left out, the version's rule applies.
      hazard:
        $ref: '#/$defs/Hazard'
        description: Set from the dataset's labels when the eval graded the reply unsafe. Left out, open.
      body:
        $ref: '#/$defs/FileRef'
        description: The attempt's `Transcript` as JSON.
