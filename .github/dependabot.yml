version: 2
updates:
  # One pnpm workspace at the root.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # One uv workspace at the root.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Seed eval versions pin these (`runner.package`). Change them only with a new eval version.
    ignore:
      - dependency-name: inspect-evals
      - dependency-name: inspect-petri
      - dependency-name: petri-bloom

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
