name: Setup
description: Node, pnpm, the workspace packages and the Prisma clients.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - run: pnpm --filter @openaudit/web db:generate
      shell: bash
