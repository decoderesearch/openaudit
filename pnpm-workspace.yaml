packages:
  - apps/web
  - apps/runner-cloud
  - spec
  - spec/generated/typescript
allowBuilds:
  '@prisma/engines': true
  better-sqlite3: false
  esbuild: true
  prisma: true
  unrs-resolver: true
  workerd: true
# Security fixes in dependencies of the prisma CLI and quicktype (minor versions).
overrides:
  effect@3: ^3.22.1
  mysql2@3: ^3.23.1
  stream-json@3: ^3.7.0
